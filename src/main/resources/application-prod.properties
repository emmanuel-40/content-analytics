# ============================================
# PRODUCTION CONFIGURATION (Render)
# ============================================
# Activated on Render via SPRING_PROFILES_ACTIVE=prod.
# Render supplies PORT automatically - do not hardcode it.
#
# Every value below is read from an environment variable set in the
# Render dashboard (Service -> Environment). NOTHING secret is hardcoded
# in this file - it only maps Render env vars onto Spring properties.
# Local development values live in application.properties.
#
# Render env vars to set (dashboard -> Environment -> Add):
#   DATABASE_URL .......... Supabase transaction pooler JDBC URL (keep ?prepareThreshold=0)
#   DB_USERNAME ........... postgres.PROJECTREF
#   DB_PASSWORD ........... Supabase DB password
#   REDIS_HOST ............ Upstash host
#   REDIS_PORT ............ 6379
#   REDIS_PASSWORD ........ Upstash password
#   JWT_SECRET ............ openssl rand -base64 64 (MUST be 64+ bytes for HS512)
#   FRONTEND_URL .......... https://your-frontend.onrender.com (public SPA URL)
#   CORS_ALLOWED_ORIGINS .. https://your-frontend.onrender.com
#   WEBSOCKET_ALLOWED_ORIGINS .. https://your-frontend.onrender.com
#   GOOGLE_CLIENT_ID ...... optional - Google sign-in stays disabled if unset
#   GOOGLE_CLIENT_SECRET .. optional
#   PAYSTACK_SECRET_KEY ... optional - payments stay disabled if unset (test keys
#                           sk_test_... for test mode, sk_live_... to take real money)
#   PAYSTACK_PUBLIC_KEY ... optional - safe to expose, only opens the popup
#   PAYMENTS_CALLBACK_URL . https://your-frontend/payment/callback (browser return page)
#   AWS_S3_BUCKET_NAME .... Supabase Storage bucket
#   AWS_REGION ............ Supabase project region, e.g. eu-central-1
#   AWS_ACCESS_KEY_ID ..... Supabase S3 access key
#   AWS_SECRET_ACCESS_KEY . Supabase S3 secret key
#   AWS_S3_ENDPOINT ....... https://<project-ref>.supabase.co/storage/v1/s3
#   GEMINI_API_KEY ........ optional - AI falls back to basic analysis without it
#   BREVO_API_KEY ......... optional - email sending disabled without it
#   EMAIL_FROM_ADDRESS .... e.g. no-reply@yourdomain.com
#
# Supabase is used for BOTH Postgres and file storage. Redis is external
# (Upstash free tier) because Supabase does not offer a Redis service.
#
# Health check path for Render and UptimeRobot:
#   /api/health  (also /actuator/health)
# ============================================

# ============================================
# Server Configuration
#
# Render assigns a random port at runtime and injects it as the PORT
# environment variable, then routes traffic to that port. Hardcoding 8080
# means the deploy receives no traffic.
# ============================================
server.port=${PORT:8080}
spring.application.name=content-analytics-backend

# NOTE: server.servlet.context-path is deliberately NOT set.
# The controllers already map /api/... , so a context-path of /api would
# expose every endpoint at /api/api/... and break the frontend and CORS.
# Render routes to the root, so no prefix is needed.

# ============================================
# NOTE: do NOT set spring.profiles.active in this file.
# Spring Boot rejects spring.profiles.* inside a profile-specific
# document (InvalidConfigDataPropertyException).
# Activate with:  --spring.profiles.active=prod
#          or:   SPRING_PROFILES_ACTIVE=prod
# ============================================

# ============================================
# DATABASE - SUPABASE POSTGRES
# ============================================
# Connection string and credentials come from Supabase Dashboard >
# Project Settings > Database.
#
# Using the TRANSACTION POOLER (port 6543) is recommended on Render because the
# free tier caps direct connections and Render instances recycle aggressively.
# The pooler does not support prepared statements, so the JDBC URL must carry
# prepareThreshold=0 - without it Hibernate throws "prepared statement already
# exists" under concurrency.
#
# Direct alternative (better latency, one instance only):
#   postgresql://postgres.REF:PASS@db.REF.supabase.co:5432/postgres
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool sizing for the Supabase transaction pooler:
# Render free tier allows ~10 concurrent instances, so cap the per-instance pool
# at 4. Going higher exhausts the project allowance and causes connection errors
# across every instance at once.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:4}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ============================================
# REDIS - PRODUCTION (Environment Variables)
# ============================================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=60000ms
spring.data.redis.jedis.pool.max-active=20
spring.data.redis.jedis.pool.max-idle=10
spring.data.redis.jedis.pool.min-idle=5
spring.data.redis.jedis.pool.max-wait=2000ms
spring.data.redis.ssl=${REDIS_SSL:true}

# ============================================
# JWT Configuration - PRODUCTION
# ============================================
# CRITICAL: Must be set via environment variable in production
# Minimum 32 characters, use strong random string
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=900000
app.jwt.refresh.expiration=604800000

# ============================================
# File Upload Configuration
# ============================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true

# Custom Upload Configuration
app.max-upload-size=52428800
app.allowed-file-types=pdf,txt,docx,pptx

# ============================================
# FILE STORAGE - SUPABASE STORAGE (S3-compatible)
# ============================================
# Supabase Storage speaks the S3 protocol, so S3StorageService works unchanged.
#
# Setup, once, in the Supabase dashboard:
#   1. Storage > Settings > enable "S3 protocol"
#   2. Project Settings > API > "S3 Access Keys" > create keys
#   3. Storage > New bucket > name it (AWS_S3_BUCKET_NAME), keep it PRIVATE
#
# Free tier includes 1 GB storage and 5 GB egress per month.
#
# AWS_S3_ENDPOINT  = https://<project-ref>.supabase.co/storage/v1/s3
# AWS_S3_REGION    = the project region, e.g. eu-central-1
# FORCE_PATH_STYLE = true: Supabase's gateway resolves buckets by path rather
#                    than subdomain, so virtual-host style addressing 404s.
app.storage.type=${STORAGE_TYPE:s3}
app.storage.s3.enabled=true
app.storage.s3.bucket-name=${AWS_S3_BUCKET_NAME}
app.storage.s3.region=${AWS_REGION}
app.storage.s3.access-key=${AWS_ACCESS_KEY_ID}
app.storage.s3.secret-key=${AWS_SECRET_ACCESS_KEY}
app.storage.s3.endpoint=${AWS_S3_ENDPOINT}
app.storage.s3.force-path-style=${AWS_S3_FORCE_PATH_STYLE:true}

# Profile pictures live in the same bucket under a separate prefix.
app.profile.picture.storage-type=${STORAGE_TYPE:s3}
app.profile.picture.bucket=${AWS_S3_BUCKET_NAME}
app.profile.picture.cdn-url=${CDN_URL}

# ============================================
# Logging
#
# Render collects STDOUT/STDERR, not log files on disk. Writing to a file
# path would either fail (read-only filesystem) or silently lose the logs,
# so file logging is disabled and everything goes to the console.
# ============================================
logging.level.root=WARN
logging.level.com.contentanalytics=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ============================================
# Actuator (Monitoring/Health) - PRODUCTION
# ============================================
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true

# Custom health check
app.health.check-interval=60000
app.health.database-timeout=10000
app.health.redis-timeout=10000

# ============================================
# Jackson Configuration
# ============================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# ============================================
# Error Handling - PRODUCTION
# ============================================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

# ============================================
# CORS Configuration - PRODUCTION
# ============================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type,X-CSRF-Token
app.cors.allow-credentials=true
app.cors.max-age=3600

# ============================================
# AI PROVIDER
# Switch with: AI_PROVIDER=gemini | anthropic | none
# ============================================
app.ai.provider=${AI_PROVIDER:gemini}

# ---------- Google Gemini (free tier) ----------
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.api-url=https://generativelanguage.googleapis.com/v1beta
app.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
app.gemini.max-tokens=2048
app.gemini.timeout-seconds=60

# ---------- Anthropic Claude (no free tier) ----------
app.anthropic.api-key=${ANTHROPIC_API_KEY:}
app.anthropic.api-url=https://api.anthropic.com/v1
app.anthropic.model=${ANTHROPIC_MODEL:claude-3-5-sonnet-20241022}
app.anthropic.max-tokens=2048

# ============================================
# RATE LIMITING
# Bounds memory used to track per-client buckets
# ============================================
app.rate-limit.max-tracked-clients=10000

# ============================================
# ASYNC JOB QUEUE
# ============================================
app.queue.type=${QUEUE_TYPE:async}

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5671}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST}
spring.rabbitmq.ssl.enabled=true

app.queue.exchange=content-analytics
app.queue.document-queue=document-processing
app.queue.routing-key=document.process

# ============================================
# Async Configuration - PRODUCTION
# ============================================
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=20
spring.task.execution.queue-capacity=500
spring.task.execution.pool.queue-capacity=500
spring.task.execution.thread-name-prefix=content-analytics-async-

spring.task.scheduling.pool.size=5
spring.task.scheduling.thread-name-prefix=content-analytics-scheduler-

# ============================================
# TLS - PRODUCTION
#
# Render terminates TLS at its edge proxy and forwards plain HTTP to the
# container. Enabling server-side SSL here would require a keystore that does
# not exist on Render and would fail startup, so it stays off. HTTPS is handled
# by Render; cookies are marked Secure based on the https CORS origins.
# ============================================
server.compression.enabled=true
server.compression.min-response-size=1024

# ============================================
# REVERSE-PROXY AWARENESS - REQUIRED FOR GOOGLE SIGN-IN
#
# Render terminates TLS at its edge proxy and forwards plain HTTP to the
# container. The Google redirect URI is built from {baseUrl} (see
# application.properties), which Spring derives from the request scheme and
# Host header. Without forward-header handling that resolves to
# http://localhost:<PORT>/login/oauth2/code/google, Google rejects the
# handshake with redirect_uri_mismatch, and every link in an email would also
# point at localhost.
#
# `framework` applies Spring's ForwardedHeaderFilter: X-Forwarded-Proto and
# X-Forwarded-Host from Render become the visible scheme and host.
# The Render dashboard value for FORWARD_HEADERS_STRATEGY is `framework`;
# the default below matches so local prod-profile runs behave the same.
# ============================================
server.forward-headers-strategy=framework

# ============================================
# WebSocket Configuration - Production
# ============================================
spring.websocket.servlet.path=/ws

# Message broker
spring.messaging.stomp.broker-relay.enabled=false

# WebSocket allowed origins (production domains)
app.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS}


# ============================================
# Brevo Email Service Configuration - Production
# ============================================
app.brevo.api-key=${BREVO_API_KEY}
app.brevo.api-url=https://api.brevo.com/v3

# Email Configuration
app.email.from-address=${EMAIL_FROM_ADDRESS}
app.email.from-name=Content Analytics Platform

# Frontend URL (for email links)
app.frontend.url=${FRONTEND_URL}

# ============================================
# Payments - PRODUCTION (Paystack)
# ============================================
# Test keys (sk_test_...) for test mode, live keys (sk_live_...) to take real
# money. Switching needs no code change - just swap the dashboard values.
# PAYMENTS_CALLBACK_URL=https://your-frontend/payment/callback
app.payments.paystack.secret-key=${PAYSTACK_SECRET_KEY:}
app.payments.paystack.public-key=${PAYSTACK_PUBLIC_KEY:}
app.payments.callback-url=${PAYMENTS_CALLBACK_URL:https://your-frontend/payment/callback}

# Token Expiry Times
app.token.email-verification-expiry-hours=24
app.token.password-reset-expiry-hours=1

# ============================================
# Profile & Image - PRODUCTION
# ============================================
app.image.max-size=5242880
app.image.allowed-types=jpeg,jpg,png,webp
app.password.min-change-interval-hours=1

# Storage for profile pictures is configured with the S3 bucket above.

# ============================================
# Misc Configuration
# ============================================
app.name=Content Analytics Platform
app.version=1.0.0
app.description=Production-ready AI-powered content analytics backend