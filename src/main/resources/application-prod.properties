# PRODUCTION CONFIGURATION (Render)
#   Activate profiles: SPRING_PROFILES_ACTIVE=prod
#   Render supplies PORT and env vars automatically.

# Server:
server.port=${PORT:8080}
spring.application.name=content-analytics-backend
server.forward-headers-strategy=framework

# Task pools (async + scheduler)
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=20
spring.task.execution.queue-capacity=500
spring.task.execution.thread-name-prefix=content-analytics-async-
spring.task.scheduling.pool.size=5
spring.task.scheduling.thread-name-prefix=content-analytics-scheduler-

# Queue (async, no broker)
app.queue.type=async
app.queue.exchange=content-analytics
app.queue.document-queue=document-processing
app.queue.routing-key=document.process

# Database (Supabase transaction pooler)
#  <-- CONFIGURED VIA Env vars below
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Redis (external, Upstash)
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD}

# JWT & token expiry
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=900000
app.jwt.refresh.expiration=604800000
app.token.email-verification-expiry-hours=24
app.token.password-reset-expiry-hours=1

# Google OAuth (optional, from env)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# Gemini (optional AI)
app.ai.provider=gemini
app.gemini.api-key=${GEMINI_API_KEY}
app.gemini.api-url=https://generativelanguage.googleapis.com/v1beta
app.gemini.model=gemini-2.5-flash
app.gemini.max-tokens=2048
app.gemini.timeout-seconds=60

# Brevo email (optional)
app.brevo.api-key=${BREVO_API_KEY}
app.brevo.api-url=https://api.brevo.com/v3
app.email.from-address=${EMAIL_FROM_ADDRESS}
app.email.from-name=Content Analytics Platform
app.frontend.url=${FRONTEND_URL}

# Paystack (test/live)
app.payments.paystack.secret-key=${PAYSTACK_SECRET_KEY:}
app.payments.paystack.public-key=${PAYSTACK_PUBLIC_KEY:}
app.payments.callback-url=${PAYMENTS_CALLBACK_URL:https://your-frontend/payment/callback}

# Image upload & security
app.image.max-size=5242880
app.image.allowed-types=jpeg,jpg,png,webp
app.password.min-change-interval-hours=1
server.compression.enabled=true
server.compression.min-response-size=1024

# WebSocket / STOMP
spring.websocket.servlet.path=/ws
spring.messaging.stomp.broker-relay.enabled=false
app.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# TLS
#  Render terminates TLS at its edge proxy; server-side SSL disabled.

# Storage (Supabase)
app.storage.type=supabase
app.storage.supabase.bucket=${AWS_S3_BUCKET_NAME}
app.storage.supabase.region=${AWS_REGION}
app.storage.supabase.access-key=${AWS_ACCESS_KEY_ID}
app.storage.supabase.secret-key=${AWS_SECRET_ACCESS_KEY}
app.storage.supabase.endpoint=${AWS_S3_ENDPOINT}

# Misc
app.name=Content Analytics Platform
app.version=1.0.0
app.description=Production-ready AI-powered content analytics backend
