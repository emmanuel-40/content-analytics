# DEFAULT CONFIGURATION (loaded for every environment)
#   application.properties        <- always loaded
#   application-{profile}.properties <- loaded only when that profile is active

spring.config.import=optional:file:./src/main/resources/application-local.properties

spring.application.name=content-analytics-backend
server.port=8080

# DATABASE - local Postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/content_analytics_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=60000ms
spring.data.redis.jedis.pool.max-active=8
spring.data.redis.jedis.pool.max-idle=8
spring.data.redis.jedis.pool.min-idle=0
spring.data.redis.jedis.pool.max-wait=-1ms

# JWT
app.jwt.expiration=900000
app.jwt.refresh.expiration=604800000

# Google OAuth (optional)
spring.security.oauth2.client.registration.google.client-id=local-dev-not-configured
spring.security.oauth2.client.registration.google.client-secret=local-dev-not-configured
spring.security.oauth2.client.registration.google.client-name=Google
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Gemini (optional)
app.ai.provider=gemini
app.gemini.api-key=
app.gemini.api-url=https://generativelanguage.googleapis.com/v1beta
app.gemini.model=gemini-3.8-flash
app.gemini.fallback-models=gemini-3.5-flash-lite
app.gemini.max-tokens=2048
app.gemini.timeout-seconds=60

# Brevo (optional)
app.brevo.api-key=
app.brevo.api-url=https://api.brevo.com/v3
# Set EMAIL_FROM_ADDRESS (or app.email.from-address in application-local.properties)
# to a sender verified in Brevo. No default: an invalid sender makes Brevo reject mail.
app.email.from-address=${EMAIL_FROM_ADDRESS:}
app.email.from-name=Content Analytics Platform

# RabbitMQ-backed jobs (docker compose starts the broker on localhost:5672)
app.queue.type=rabbitmq
app.queue.exchange=content-analytics
app.queue.document-queue=document-processing
app.queue.routing-key=document.process
app.queue.email-queue=email-delivery
app.queue.email-routing-key=email.deliver

# Transactional email outbox publisher
app.email.outbox.batch-size=100
app.email.outbox.grace-seconds=5
app.email.outbox.initial-delay-ms=10000
app.email.outbox.interval-ms=30000
app.email.max-attempts=5

# RabbitMQ (optional)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/
spring.rabbitmq.ssl.enabled=false

# Paystack (test mode)
app.payments.paystack.secret-key=
app.payments.paystack.public-key=
app.payments.callback-url=http://localhost:5173/payment/callback

# Tokens & image
app.token.email-verification-expiry-hours=24
app.token.password-reset-expiry-hours=1
app.image.max-size=5242880
app.image.allowed-types=jpeg,jpg,png,webp

# Upload limits
# Supabase Free allows 50 MB per file and 1 GB total. Keep app uploads smaller
# so the free bucket is not exhausted by a handful of large PDFs.
app.max-upload-size=10485760
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

app.password.min-change-interval-hours=1

# Idempotency (Redis-backed dedupe for idempotent mutation endpoints)
app.idempotency.ttl-hours=24

# Rate limiting (atomic Redis fixed window)
app.rate-limit.enabled=true
app.rate-limit.login.max-requests=5
app.rate-limit.login.window-seconds=900
app.rate-limit.register.max-requests=3
app.rate-limit.register.window-seconds=900
app.rate-limit.payment-initialize.max-requests=10
app.rate-limit.payment-initialize.window-seconds=60
app.rate-limit.general.max-requests=30
app.rate-limit.general.window-seconds=60

# Account lockout (Redis-backed failed-attempt tracker + hard lock)
app.lockout.max-attempts=5
app.lockout.lockout-minutes=30
app.lockout.reset-minutes=60

# CORS / WebSocket
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600
spring.websocket.servlet.path=/ws
app.websocket.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000

# Async / scheduling pools
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.queue-capacity=100
spring.task.execution.thread-name-prefix=content-analytics-async-
spring.task.scheduling.pool.size=2
spring.task.scheduling.thread-name-prefix=content-analytics-scheduler-

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Jackson
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC

# Error handling
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on-param
server.error.include-exception=false

# Logging
logging.level.root=INFO
logging.level.com.contentanalytics=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# Misc
app.name=Content Analytics Platform
app.version=1.0.0
app.description=AI-powered content analytics backend
