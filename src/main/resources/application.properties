
# DEFAULT CONFIGURATION (loaded for every environment)
# 
# How Spring Boot resolves configuration:
#   application.properties        <- always loaded (this file)
#   application-{profile}.properties <- loaded only when that profile is active
#
# So development needs NO flags at all:
#   mvn spring-boot:run
#
# Production loads this file too and then overrides it:
#   mvn spring-boot:run -Dspring-boot.run.profiles=prod
#   (or set SPRING_PROFILES_ACTIVE=prod)
#
# Every value below is a plain local-development value - edit this file
# directly for local changes. Production overrides live in
# application-prod.properties and are supplied by the Render dashboard.
# 
spring.application.name=content-analytics-backend
server.port=8080

# 
# DATABASE - LOCAL (PostgreSQL)
# 
# Plain local Postgres. Edit the values directly if yours differs.
spring.datasource.url=jdbc:postgresql://localhost:5432/content_analytics_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool kept small so local Postgres is not overwhelmed
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# 
# JPA / HIBERNATE
# 
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# 
# FLYWAY - schema migrations
# 
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# 
# REDIS - LOCAL
# 
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=60000ms
spring.data.redis.jedis.pool.max-active=8
spring.data.redis.jedis.pool.max-idle=8
spring.data.redis.jedis.pool.min-idle=0
spring.data.redis.jedis.pool.max-wait=-1ms

# 
# JWT
# Access token 15 minutes, refresh token 7 days.
# HS512 requires at least 512 bits (64 bytes) of key material per RFC 7518.
# Generate a real one with: openssl rand -base64 64
# 
app.jwt.secret=UZ9r5Tn3eKA9xGC+Xzz4AGTvIEy2YXtHk1rIfV2tQpOVxVV25cnFGnO99mpzEh+5
OEqVSJ1gmO3wf80XLqB4ow==

app.jwt.expiration=900000
app.jwt.refresh.expiration=604800000

# 
# GOOGLE SIGN-IN (OAuth2 authorization-code flow) - FREE
# 
# To sign in with Google locally, paste your Google Cloud Console credentials
# here (OAuth client ID, type "Web application") and restart. Leave both as-is
# to run without Google: GET /api/auth/providers reports google=false so the
# frontend hides the button.
#
# Redirect URI to register in Google Cloud Console for local development:
#   http://localhost:8080/login/oauth2/code/google
#
# Only the credentials are configured here. Spring Boot fills in Google's
# authorization, token, userinfo and JWKS endpoints automatically from
# CommonOAuth2Provider("google"), so nothing else needs to be pinned down.
#
# The placeholder default exists purely so the ClientRegistration bean is present
# out of the box - that keeps `mvn spring-boot:run`, the test suite and
# CI bootable with no credentials. GET /api/auth/providers reports google=false
# until a real id is pasted in, so the frontend hides the button rather than
# offering a broken one. Production credentials live in
# application-prod.properties (Render dashboard).
spring.security.oauth2.client.registration.google.client-id=local-dev-not-configured
spring.security.oauth2.client.registration.google.client-secret=local-dev-not-configured
spring.security.oauth2.client.registration.google.client-name=Google
spring.security.oauth2.client.registration.google.scope=openid,profile,email
# {baseUrl} is an OAuth2 template variable (not a Spring placeholder) expanded from
# the request, so one registration covers localhost and the deployed host. In prod
# server.forward-headers-strategy must be enabled for it to see the public scheme -
# see application-prod.properties. To pin it exactly instead, override
# spring.security.oauth2.client.registration.google.redirect-uri with the full URL.
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# 
# FILE UPLOAD
# 
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.max-upload-size=52428800
app.allowed-file-types=pdf,txt,docx,pptx

# 
# RATE LIMITING
# Bounds memory used to track per-client buckets (prevents unbounded growth)
# 
app.rate-limit.max-tracked-clients=10000

# 
# STORAGE - local filesystem
# 
app.storage.type=local
app.storage.local.path=/tmp/content-analytics/uploads
app.storage.local.base-url=http://localhost:8080/api/documents/files
app.profile.picture.storage-path=/tmp/content-analytics/profile-pictures
app.profile.picture.base-url=http://localhost:8080/api/profile/pictures

# 
# AI PROVIDER
# Switch vendor with ONE line:
#   gemini     - free tier (recommended)
#   anthropic  - no free tier, requires key
#   none       - disable AI entirely
# With no API key the app still runs and falls back to basic analysis.
# 
app.ai.provider=gemini

# ---------- Google Gemini (free tier) ----------
app.gemini.api-key=
app.gemini.api-url=https://generativelanguage.googleapis.com/v1beta
app.gemini.model=gemini-2.5-flash
app.gemini.max-tokens=2048
app.gemini.timeout-seconds=60

# ---------- Anthropic Claude (no free tier) ----------
app.anthropic.api-key=
app.anthropic.api-url=https://api.anthropic.com/v1
app.anthropic.model=claude-3-5-sonnet-20241022
app.anthropic.max-tokens=2048

# 
# ASYNC JOB QUEUE
#   async    - in-process @Async (default, zero infrastructure)
#   rabbitmq - durable broker (CloudAMQP free tier works)
# If the broker is unreachable the queue falls back to local execution,
# so uploads still process.
# 
app.queue.type=async

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/
spring.rabbitmq.ssl.enabled=false

app.queue.exchange=content-analytics
app.queue.document-queue=document-processing
app.queue.routing-key=document.process

# 
# EMAIL - Brevo (300 emails/day free tier)
# 
app.brevo.api-key=
app.brevo.api-url=https://api.brevo.com/v3
app.email.from-address=no-reply@example.com
app.email.from-name=Content Analytics Platform
app.frontend.url=http://localhost:5173

# ============================================
# PAYMENTS - LOCAL (Paystack test mode)
# ============================================
# Paste TEST keys from https://dashboard.paystack.com/#/settings/developers
# (sk_test_... / pk_test_...) to try the real flow locally: pay with the fake
# card 4084 0840 8408 4081 and zero real money moves. Leave both empty to run
# without payments: GET /api/payments/status reports configured=false so the
# frontend hides the Buy button rather than opening a checkout that fails.
# NEVER paste live (sk_live_...) keys here - those go on the Render dashboard.
app.payments.paystack.secret-key=
app.payments.paystack.public-key=
# Where Paystack sends the browser after payment (UX only - credits move on
# the webhook, never on this callback).
app.payments.callback-url=http://localhost:5173/payment/callback

# 
# TOKEN EXPIRY
# 
app.token.email-verification-expiry-hours=24
app.token.password-reset-expiry-hours=1

# 
# PROFILE & IMAGE
# 
app.image.max-size=5242880
app.image.allowed-types=jpeg,jpg,png,webp
app.password.min-change-interval-hours=1

# 
# CORS / WEBSOCKET - LOCAL (frontend dev servers)
# 
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600

spring.websocket.servlet.path=/ws
app.websocket.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

# 
# ASYNC / SCHEDULING
# 
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.queue-capacity=100
spring.task.execution.thread-name-prefix=content-analytics-async-
spring.task.scheduling.pool.size=2
spring.task.scheduling.thread-name-prefix=content-analytics-scheduler-

# 
# ACTUATOR
# Only health and metrics are exposed. 'env' and 'configprops' are NOT exposed
# because they can leak secrets.
# 
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# 
# JACKSON
# 
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC

# 
# ERROR HANDLING - detailed for local debugging
# 
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on-param
server.error.include-exception=false

# 
# LOGGING
# Defaults are safe for any environment.
#
# Hibernate SQL/binder tracing is intentionally NOT enabled here. Those loggers
# are more specific than prod's 'org.hibernate=WARN', so enabling them in this
# default file would leak every statement and bound parameter into production.
# To see SQL during local development, create the git-ignored file
# src/main/resources/application-local.properties containing:
#   logging.level.org.hibernate.SQL=DEBUG
#   logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# 
logging.level.root=INFO
logging.level.com.contentanalytics=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

# 
# MISC
# 
app.name=Content Analytics Platform
app.version=1.0.0
app.description=AI-powered content analytics backend