# ============================================================
# TEST PROFILE  (src/test/resources/application-test.properties)
#
# Activated with @ActiveProfiles("test"). This configuration is
# deliberately self-contained and reads NO environment variables,
# so a test can never be redirected at a real database.
#
#   Local dev ......... content-analytics-backend/src/main/resources/application.properties
#   Production ........ src/main/resources/application-prod.properties (Supabase)
#   THIS FILE ......... tests only. Nothing here is shipped.
# ============================================================

# ---- DATABASE: in-memory H2 ---------------------------------
# The URL is hard-coded (no ${DATABASE_URL:...} placeholder) on purpose: an
# environment variable must not be able to repoint a test at Postgres/Supabase.
#
# MODE=PostgreSQL asks H2 to behave as closely to Postgres as it can.
spring.datasource.url=jdbc:h2:mem:content_analytics_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---- SCHEMA ---------------------------------------------------
# The Flyway migrations are PostgreSQL-specific (gen_random_uuid(), expression
# indexes), so tests do NOT run them. Hibernate builds the schema from the
# entities and drops it afterwards; the test database lives only in memory.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Small pool: the in-memory database is single-user here.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1

# ---- OUTBOUND SERVICES: disabled -----------------------------
# Redis and RabbitMQ are optional at runtime; in tests nothing should dial out.
app.queue.type=async

# ---- STORAGE: local, under target/ ---------------------------
# Never S3: tests must not upload anything to the real private bucket.
app.storage.type=local
app.storage.local.path=target/test-uploads
app.storage.local.base-url=http://localhost:8080/api/documents/files

# ---- CORS ------------------------------------------------------
app.cors.allowed-origins=http://localhost:3000
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600

# ---- MISC (explicit so the test does not depend on env vars) ----
app.jwt.secret=test-only-jwt-secret-that-is-long-enough-for-hs512-0123456789abcdef0123456789abcdef
app.name=Content Analytics Platform
app.version=1.0.0
app.description=Tests
